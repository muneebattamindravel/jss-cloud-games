<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kaanch Tod</title>
  <style>
    @font-face { font-family: 'Lilita One'; src: url('fonts/lilita-one.woff2') format('woff2'); font-display: swap; }
    /* game UI: glossy candy plates, thick dark outlines, gold trims; everything sits in the 414x736 design rect */
    :root {
      --ink: #43105f; --red: #e2263f; --red-hi: #ff5a6e; --red-lo: #a3102a; --red-edge: #6e0619;
      --gold: #ffc72c; --gold-hi: #fff0a6; --gold-lo: #d98a00;
      --green: #36d061; --green-hi: #8cf59c; --green-lo: #13893a;
      --purple: #8a2ef0; --purple-lo: #4a1291; --cream: #fffaf1; --bg: #5fae34;
      --font: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100vw; height: 100%; }
    #hud { position: fixed; left: 0; top: 0; width: 414px; height: 736px; transform-origin: 0 0; pointer-events: none; font-family: var(--font); color: #fff; }
    button { font-family: var(--font); }
    .ol { text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink); }

    /* balls: a ribbon over a framed card, like a calendar tile */
    #ballsCard { position: absolute; left: 14px; top: 30px; width: 86px; height: 80px; }
    #ballsCard .frame { position: absolute; inset: 8px 0 0; border-radius: 20px; background: linear-gradient(var(--red-hi), var(--red) 45%, var(--red-lo)); box-shadow: 0 0 0 3px var(--red-edge), 0 6px 0 var(--red-edge), 0 10px 16px rgba(0,0,0,.28); }
    #ballsCard .face { position: absolute; inset: 20px 7px 8px; border-radius: 14px; background: linear-gradient(#fff 0%, #fdf3f7 60%, #f2dde8 100%); box-shadow: inset 0 -4px 0 rgba(150,40,80,.18), inset 0 2px 0 #fff; }
    #ballsCard .ribbon { position: absolute; left: 50%; top: -4px; transform: translateX(-50%); padding: 3px 14px 5px; border-radius: 11px; font-size: 16px; white-space: nowrap;
      background: linear-gradient(var(--red-hi), var(--red-lo)); box-shadow: 0 0 0 2.5px var(--gold), 0 0 0 5px var(--red-edge), 0 4px 0 2px var(--red-edge); }
    #ballsN { position: absolute; left: 7px; right: 7px; top: 22px; bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff;
      -webkit-text-stroke: 7px var(--red); paint-order: stroke fill; text-shadow: 0 3px 0 rgba(110,6,25,.35); letter-spacing: 1px; }
    #ballsCard.low #ballsN { animation: lowPulse .8s ease-in-out infinite; }
    @keyframes lowPulse { 50% { transform: scale(1.12); } }
    #ballsCard.bump { animation: bump .28s ease-out; }
    @keyframes bump { 40% { transform: scale(1.12) rotate(-3deg); } }

    /* score and tower progress, top centre */
    #scoreBox { position: absolute; left: 110px; right: 110px; top: 34px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #score { font-size: 38px; line-height: 1; }
    #score.pop { animation: scorePop .25s ease-out; }
    @keyframes scorePop { 40% { transform: scale(1.18); } }
    #towerBar { position: relative; width: 150px; height: 22px; border-radius: 12px; background: rgba(40,8,70,.55); box-shadow: 0 0 0 3px var(--ink), inset 0 3px 4px rgba(0,0,0,.35); overflow: hidden; }
    #towerFill { position: absolute; left: 3px; top: 3px; bottom: 3px; width: 0; border-radius: 9px; background: linear-gradient(var(--gold-hi), var(--gold) 55%, var(--gold-lo)); transition: width .35s ease-out; }
    #towerFill::after { content: ''; position: absolute; left: 6px; right: 6px; top: 2px; height: 4px; border-radius: 3px; background: rgba(255,255,255,.6); }
    #tower { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: 1px; }

    /* round settings button with a gold ring */
    #gear { position: absolute; right: 14px; top: 34px; width: 60px; height: 60px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; pointer-events: auto;
      background: radial-gradient(circle at 38% 30%, var(--red-hi), var(--red) 45%, var(--red-lo)); box-shadow: 0 0 0 4px var(--gold), 0 0 0 7px var(--red-edge), 0 6px 0 4px var(--red-edge), 0 10px 16px rgba(0,0,0,.3); }
    #gear svg { width: 34px; height: 34px; display: block; margin: auto; filter: drop-shadow(0 2px 0 rgba(90,0,20,.5)); }
    #gear:active { transform: translateY(3px) scale(.96); }

    #floats { position: absolute; inset: 0; overflow: hidden; }
    .float { position: absolute; transform: translate(-50%, -50%); font-size: 24px; animation: rise 1.1s ease-out forwards; white-space: nowrap;
      text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink); }
    .float.gold { color: var(--gold); } .float.red { color: #ffd0d6; } .float.green { color: #b8ffbf; } .float.blue { color: #c9ecff; }
    .float.big { font-size: 32px; }
    @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.2); } 30% { transform: translate(-50%, -70%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -230%) scale(1); } }

    /* tower cleared */
    #banner { position: absolute; left: 0; right: 0; top: 190px; text-align: center; opacity: 0; }
    #banner .rays { position: absolute; left: 50%; top: 50px; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%;
      background: repeating-conic-gradient(rgba(255,240,170,.35) 0 10deg, rgba(255,240,170,0) 10deg 22deg); -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%); animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #banner b { position: relative; display: block; font-weight: 400; font-size: 84px; color: var(--gold); -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink), 0 14px 24px rgba(0,0,0,.35); }
    #banner span { position: relative; display: inline-block; margin-top: 4px; padding: 4px 20px 7px; border-radius: 16px; font-size: 28px; background: linear-gradient(var(--purple), var(--purple-lo)); box-shadow: 0 0 0 3px var(--gold), 0 5px 0 3px var(--ink); }
    #banner.show { animation: bannerIn 1.8s ease-out forwards; }
    @keyframes bannerIn { 0% { opacity: 0; transform: scale(.3) rotate(-8deg); } 14% { opacity: 1; transform: scale(1.15) rotate(2deg); } 22% { transform: scale(1) rotate(0); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.08); } }

    /* screens */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; pointer-events: auto; transition: opacity .3s; }
    .screen.hide { opacity: 0; pointer-events: none; }
    .shade { background: radial-gradient(ellipse at 50% 45%, rgba(40,8,70,.2), rgba(40,8,70,.7)); }
    .logo { position: relative; text-align: center; line-height: .86; transform: rotate(-5deg); margin: -40px 0 26px; }
    .logo .a, .logo .b { display: block; font-weight: 400; paint-order: stroke fill; }
    .logo .a { font-size: 74px; color: #c9ecff; -webkit-text-stroke: 12px #133e93; text-shadow: 0 8px 0 #133e93, 0 16px 20px rgba(0,0,0,.3); background: linear-gradient(#ffffff, #8fd3ff 60%, #3d9df0); -webkit-background-clip: text; background-clip: text; }
    .logo .b { font-size: 108px; color: var(--gold); -webkit-text-stroke: 14px var(--ink); text-shadow: 0 9px 0 var(--ink), 0 18px 22px rgba(0,0,0,.35); }
    .logo .shine { position: absolute; right: 18px; top: 4px; width: 26px; height: 26px; background: radial-gradient(circle, #fff 0 20%, transparent 22%), conic-gradient(from 0deg, transparent 0 40deg, #fff 45deg, transparent 50deg 130deg, #fff 135deg, transparent 140deg 220deg, #fff 225deg, transparent 230deg 310deg, #fff 315deg, transparent 320deg); border-radius: 50%; animation: twinkle 1.6s ease-in-out infinite; }
    @keyframes twinkle { 50% { transform: scale(.4) rotate(45deg); opacity: .5; } }
    .tag { max-width: 290px; padding: 12px 18px 14px; border-radius: 18px; font-size: 18px; line-height: 1.25; text-align: center; color: var(--ink); background: linear-gradient(#fff, #f6eefb); box-shadow: 0 0 0 3px var(--ink), 0 5px 0 3px var(--ink); }
    .tag b { color: var(--red); font-weight: 400; }
    .btn { position: relative; font-size: 32px; color: #fff; border: 0; border-radius: 24px; padding: 13px 58px 17px; cursor: pointer; overflow: hidden;
      background: linear-gradient(var(--green-hi), var(--green) 50%, var(--green-lo)); box-shadow: 0 0 0 3px var(--ink), 0 7px 0 3px var(--ink), 0 14px 22px rgba(0,0,0,.3);
      text-shadow: 0 3px 0 var(--green-lo), 2px 0 0 var(--green-lo), -2px 0 0 var(--green-lo); }
    .btn::before { content: ''; position: absolute; left: 12px; right: 12px; top: 5px; height: 12px; border-radius: 8px; background: rgba(255,255,255,.45); }
    .btn:active { transform: translateY(4px); box-shadow: 0 0 0 3px var(--ink), 0 3px 0 3px var(--ink); }
    .btn:disabled { filter: grayscale(.6) brightness(.9); animation: none !important; }
    .btn.gold { background: linear-gradient(var(--gold-hi), var(--gold) 50%, var(--gold-lo)); text-shadow: 0 3px 0 #a35a00, 2px 0 0 #a35a00, -2px 0 0 #a35a00; }
    #menu .btn { animation: pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.07); } }

    /* panels (game over, settings) */
    .panel { position: relative; width: 320px; border-radius: 30px; padding: 46px 18px 26px; text-align: center;
      background: linear-gradient(var(--red-hi), var(--red) 30%, var(--red-lo)); box-shadow: 0 0 0 4px var(--red-edge), 0 9px 0 4px var(--red-edge), 0 20px 34px rgba(0,0,0,.45); animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
    .screen.hide .panel { animation: none; }
    @keyframes pop { 0% { transform: scale(.4); } }
    .panel .title { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); white-space: nowrap; padding: 8px 26px 11px; border-radius: 18px; font-size: 30px;
      background: linear-gradient(var(--purple), var(--purple-lo)); box-shadow: 0 0 0 3.5px var(--gold), 0 0 0 7px var(--ink), 0 7px 0 5px var(--ink); }
    .panel .close { position: absolute; right: -12px; top: -12px; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; color: #fff; font-size: 26px; line-height: 40px;
      background: radial-gradient(circle at 40% 30%, var(--red-hi), var(--red-lo)); box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--red-edge), 0 4px 0 5px var(--red-edge); }
    .card { background: linear-gradient(#fff, #f8eef6); border-radius: 20px; padding: 12px 14px 14px; color: var(--ink); margin-bottom: 22px; box-shadow: inset 0 -5px 0 rgba(140,40,90,.15); }
    .card small { display: block; font-size: 16px; color: var(--red); letter-spacing: 1px; }
    .card .big { display: block; font-size: 60px; line-height: 1.05; color: #fff; -webkit-text-stroke: 9px var(--purple); paint-order: stroke fill; }
    .stats { display: flex; gap: 10px; margin-top: 8px; }
    .stats div { flex: 1; padding: 6px 4px 8px; border-radius: 12px; background: #f1e3f1; font-size: 13px; color: var(--purple-lo); }
    .stats b { display: block; font-weight: 400; font-size: 24px; color: var(--ink); }
    .newbest { display: none; margin: -4px auto 8px; width: max-content; padding: 3px 12px 5px; border-radius: 10px; font-size: 15px; background: var(--gold); color: var(--ink); }
    .newbest.on { display: block; animation: lowPulse .9s ease-in-out infinite; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; margin-bottom: 12px; border-radius: 16px; background: linear-gradient(#fff, #f8eef6); color: var(--ink); font-size: 22px; }
    .toggle { position: relative; width: 74px; height: 38px; border-radius: 20px; border: 0; cursor: pointer; background: var(--green); box-shadow: inset 0 3px 5px rgba(0,0,0,.25), 0 0 0 3px var(--ink); }
    .toggle::after { content: ''; position: absolute; top: 4px; left: 40px; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: left .2s; }
    .toggle.off { background: #b9a9c6; } .toggle.off::after { left: 4px; }
    @media (prefers-reduced-motion: reduce) { #menu .btn, #banner .rays, .logo .shine { animation: none; } }
  </style>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/rapier.js"></script>
</head>
<body>
  <canvas id="game" aria-label="Kaanch Tod game"></canvas>
  <div id="hud">
    <div id="ballsCard"><div class="frame"></div><div class="face"></div><div class="ribbon ol">Balls</div><div id="ballsN">0</div></div>
    <div id="scoreBox">
      <div id="score" class="ol">0</div>
      <div id="towerBar"><div id="towerFill"></div><div id="tower" class="ol">TOWER 1</div></div>
    </div>
    <button id="gear" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1L14.5 2.4a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4L9.1 5.1a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.7c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
    <div id="floats"></div>
    <div id="banner"><div class="rays"></div><b>SAAF!</b><span>+0</span></div>
    <div id="menu" class="screen shade">
      <div class="logo"><span class="a">KAANCH</span><span class="b">TOD</span><i class="shine"></i></div>
      <div class="tag">Tap the tower to fire. <b>Smash</b> the glass, <b>split</b> the wood, knock everything off the table.</div>
      <button class="btn" id="playBtn" type="button" disabled>LOADING</button>
    </div>
    <div id="over" class="screen shade hide">
      <div class="panel">
        <div class="title ol">OUT OF BALLS!</div>
        <div class="card">
          <small>SCORE</small><span class="big" id="finalScore">0</span>
          <div class="newbest" id="newBest">NEW BEST!</div>
          <div class="stats"><div>Towers<b id="cleared">0</b></div><div>Best<b id="best">0</b></div></div>
        </div>
        <button class="btn" id="againBtn" type="button">PLAY AGAIN</button>
      </div>
    </div>
    <div id="settings" class="screen shade hide">
      <div class="panel">
        <div class="title ol">SETTINGS</div>
        <button class="close ol" id="closeSet" type="button" aria-label="Close">&#x2715;</button>
        <div class="row">Sound<button class="toggle" id="soundTog" type="button" aria-label="Sound"></button></div>
        <button class="btn gold" id="resumeBtn" type="button">RESUME</button>
      </div>
    </div>
  </div>
  <script src="js/rules.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
