<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kaanch Tod</title>
  <style>
    @font-face { font-family: 'Lilita One'; src: url('fonts/lilita-one.woff2') format('woff2'); font-display: swap; }
    :root { --ink: #3a1266; --red: #d81e3a; --red-dark: #8f0f22; --gold: #ffc114; --green: #2fcf5f; --green-dark: #168a3a; --cream: #fff7e8; --bg: #62b336; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100vw; height: 100%; }
    #hud { position: fixed; left: 0; top: 0; width: 414px; height: 736px; transform-origin: 0 0; pointer-events: none;
      font-family: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; color: #fff; }
    .stroke { text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink); }
    #ballsCard { position: absolute; left: 16px; top: 26px; width: 84px; height: 72px; border-radius: 18px; background: linear-gradient(#e83048, #b3132c); box-shadow: 0 5px 0 #7d0b1d, 0 8px 14px rgba(0,0,0,.25); text-align: center; }
    #ballsCard small { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); padding: 3px 12px 4px; border-radius: 10px; background: linear-gradient(#f0435a, #c8142e); box-shadow: 0 0 0 3px #ffd75a, 0 3px 0 #7d0b1d; font-size: 15px; white-space: nowrap; }
    #ballsCard b { display: block; margin: 10px 7px 0; height: 52px; line-height: 54px; border-radius: 13px; background: linear-gradient(#ffffff, #f1e9f4); color: #c8142e; font-size: 36px; font-weight: 400; box-shadow: inset 0 -4px 0 rgba(120,40,80,.15); text-shadow: 0 2px 0 rgba(120,0,20,.15); }
    #ballsCard.low b { color: #ff2a3d; }
    #ballsCard.bump { animation: bump .25s ease-out; }
    @keyframes bump { 40% { transform: scale(1.14); } }
    #score { position: absolute; left: 0; right: 0; top: 30px; text-align: center; font-size: 40px; }
    #tower { position: absolute; right: 80px; top: 40px; padding: 6px 12px; border-radius: 16px; background: rgba(58,18,102,.55); font-size: 14px; letter-spacing: 1px; }
    #mute { position: absolute; right: 16px; top: 26px; width: 54px; height: 54px; border-radius: 50%; border: 0; background: radial-gradient(circle at 40% 35%, #ef3550, var(--red-dark)); box-shadow: 0 0 0 4px var(--gold), 0 4px 10px rgba(0,0,0,.3); pointer-events: auto; cursor: pointer; }
    #mute::before { content: ''; position: absolute; left: 16px; top: 19px; width: 8px; height: 16px; background: #fff; border-radius: 2px; }
    #mute::after { content: ''; position: absolute; left: 20px; top: 13px; border-style: solid; border-width: 14px 14px 14px 0; border-color: transparent #fff transparent transparent; transform: scaleX(.9); }
    #mute.off { filter: grayscale(1) brightness(.8); }
    #floats { position: absolute; inset: 0; }
    .float { position: absolute; transform: translate(-50%, -50%); font-size: 22px; animation: rise 1.1s ease-out forwards; white-space: nowrap;
      text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
    .float.gold { color: var(--gold); }
    .float.red { color: #ffd0d6; }
    .float.green { color: #b8ffbf; }
    .float.blue { color: #bfe6ff; }
    .float.big { font-size: 30px; }
    @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 30% { transform: translate(-50%, -70%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -220%) scale(1); } }
    #banner { position: absolute; left: 0; right: 0; top: 210px; text-align: center; opacity: 0; }
    #banner b { display: block; font-weight: 400; font-size: 78px; color: var(--gold); text-shadow: 0 6px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 0 10px 20px rgba(0,0,0,.35); }
    #banner span { display: block; font-size: 32px; text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink); }
    #banner.show { animation: bannerIn 1.7s ease-out forwards; }
    @keyframes bannerIn { 0% { opacity: 0; transform: scale(.3) rotate(-8deg); } 14% { opacity: 1; transform: scale(1.15) rotate(2deg); } 22% { transform: scale(1) rotate(0); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; pointer-events: auto; transition: opacity .3s; }
    .screen.hide { opacity: 0; pointer-events: none; }
    #menu { background: linear-gradient(rgba(58,18,102,.15), rgba(58,18,102,.55)); }
    .logo { text-align: center; line-height: .9; transform: rotate(-4deg); margin-bottom: 40px; }
    .logo .a { font-size: 76px; color: #a6dcff; text-shadow: 0 6px 0 #1d4f9e, 4px 0 0 #1d4f9e, -4px 0 0 #1d4f9e, 0 -4px 0 #1d4f9e, 0 12px 18px rgba(0,0,0,.3); }
    .logo .b { font-size: 96px; color: var(--gold); text-shadow: 0 7px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink), 0 14px 20px rgba(0,0,0,.3); }
    .tag { font-size: 20px; text-align: center; max-width: 300px; }
    .btn { font: inherit; font-size: 30px; color: #fff; border: 0; border-radius: 22px; padding: 12px 54px 16px; cursor: pointer; background: linear-gradient(#5ff08a, var(--green)); box-shadow: 0 6px 0 var(--green-dark), 0 10px 20px rgba(0,0,0,.3); text-shadow: 0 3px 0 var(--green-dark); }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-dark); }
    #menu .btn { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    #over { background: rgba(30,8,60,.6); }
    .panel { width: 310px; border-radius: 26px; background: linear-gradient(#ef3550, var(--red)); box-shadow: 0 8px 0 var(--red-dark), 0 18px 30px rgba(0,0,0,.4); padding: 18px 16px 24px; text-align: center; animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
    #over.hide .panel { animation: none; }
    @keyframes pop { 0% { transform: scale(.4); } }
    .panel h2 { margin: 0 0 12px; font-weight: 400; font-size: 34px; }
    .panel .card { background: var(--cream); border-radius: 18px; padding: 12px; color: var(--ink); margin-bottom: 20px; }
    .panel .card small { display: block; font-size: 16px; color: var(--red); letter-spacing: 1px; }
    .panel .card b { display: block; font-weight: 400; font-size: 56px; }
    .panel .card span { font-size: 16px; color: #7a2fd0; }
    @media (prefers-reduced-motion: reduce) { #menu .btn { animation: none; } }
  </style>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/rapier.js"></script>
</head>
<body>
  <canvas id="game" aria-label="Kaanch Tod game"></canvas>
  <div id="hud">
    <div id="ballsCard" class="stroke"><small>Balls</small><b id="ballsN">0</b></div>
    <div id="score" class="stroke">0</div>
    <div id="tower">TOWER 1</div>
    <button id="mute" type="button" aria-label="Sound on or off"></button>
    <div id="floats"></div>
    <div id="banner"></div>
    <div id="menu" class="screen">
      <div class="logo"><div class="a">KAANCH</div><div class="b">TOD</div></div>
      <div class="tag stroke">Tap the tower to fire. Smash the glass, split the wood, clear the table.</div>
      <button class="btn" id="playBtn" type="button" disabled>LOADING</button>
    </div>
    <div id="over" class="screen hide">
      <div class="panel">
        <h2 class="stroke">BALLS KHATAM!</h2>
        <div class="card"><small>SCORE</small><b id="finalScore">0</b><span>Towers cleared: <span id="cleared">0</span></span></div>
        <button class="btn" id="againBtn" type="button">PLAY AGAIN</button>
      </div>
    </div>
  </div>
  <script src="js/rules.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
