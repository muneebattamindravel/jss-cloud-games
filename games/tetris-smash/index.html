<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="/games/_shared/no-touch-ui.js"></script>
  <!-- Global sound mute: must load before any audio is constructed. -->
  <script src="../_shared/mute.js"></script>
  <script src="../_shared/kj-tutorial-state.js"></script>
  <script src="../_shared/kj-press.js"></script>
  <script src="../_shared/kj-replay.js"></script>
  <script src="../_shared/kj-fit.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tetris Smash</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <canvas id="game" aria-label="Tetris Smash"></canvas>
  <div class="g-screen" id="menu">
    <div class="g-card">
      <h1 class="g-logo"><span class="g-l1">TETRIS</span><span class="g-l2">SMASH</span></h1>
      <p class="g-tag">Fill rows. 5 minutes. Score big.</p>
      <button class="g-btn" id="playBtn" type="button" disabled>PREPARING YOUR GAME</button>
      <button class="g-link" id="howBtn" type="button">How to play</button>
    </div>
  </div>
  <div class="g-screen is-hidden" id="over">
    <div class="g-card">
      <div class="g-kicker" id="overKicker">TIME'S UP</div>
      <div class="g-label">SCORE</div>
      <b class="g-score" id="finalScore">0</b>
      <div class="g-row"><span>Rows cleared</span><strong id="finalLines">0</strong></div>
      <button class="g-btn" id="againBtn" type="button">PLAY AGAIN</button>
    </div>
  </div>
  <button id="skipBtn" class="is-hidden" type="button">SKIP</button>
  <div id="readyBox" class="is-hidden">
    <div class="g-kicker">YOU'RE READY!</div>
    <button class="g-btn" id="readyBtn" type="button" disabled>PREPARING YOUR GAME</button>
  </div>
  <script src="js/rules.js"></script>
  <script src="js/game.js" defer></script>

  <!-- KJ platform bridge, the 2048 Rush shape:
       1. KJ_GAME_LOADED at load so the launcher knows we are here.
       2. The session is minted ON LOAD. PLAY stays disabled ("PREPARING YOUR
          GAME") until the seed exists, with no timeout: a run started before
          its session exists can never count.
       3. __kjGameStart records the v2 marker; __kjAct records each accepted
          action with the fixed step it was applied before.
       4. __kjSubmit(score) once, after the end has played out. -->
  <script src="/sdk/kj-sdk/kj-sdk-v2.js"></script>
  <script>
    (function () {
      var GAME_ID = 'tetris-smash';
      var _started = false;
      var _submitted = false;

      window.__kjEmbed = (window.parent !== window) || /[?&]replay=1(&|$)/.test(location.search);
      if (window.__kjEmbed) document.body.classList.add('kj-embed');

      var _sessionReady = false;
      var _readyWaiters = [];
      window.__kjSessionReady = function () { return _sessionReady; };
      window.__kjOnSessionReady = function (cb) {
        if (_sessionReady) { try { cb(); } catch (_e) {} return; }
        _readyWaiters.push(cb);
      };
      function markReady() {
        if (_sessionReady) return;
        _sessionReady = true;
        var q = _readyWaiters.splice(0);
        for (var i = 0; i < q.length; i++) { try { q[i](); } catch (_e) {} }
      }

      var _platformReady = false;
      var _wantSession = false;
      window.addEventListener('message', function (e) {
        if (!e.data) return;
        if (e.data.type === 'KJ_CONFIG' || e.data.type === 'KJ_V2_START') {
          _platformReady = true;
          if (_wantSession) { _wantSession = false; window.__kjBeginSession(); }
        }
      });

      window.__kjBeginSession = function () {
        if (_started) return;
        if (!window.__kjEmbed) { _started = true; markReady(); return; }
        if (!_platformReady) { _wantSession = true; return; }
        _started = true;
        if (typeof window.kjStartV2 !== 'function') return;
        window.kjStartV2({ gameId: GAME_ID })
          .then(function () { markReady(); })
          .catch(function (err) {
            // Deliberately NOT markReady(): the SDK has told the platform, which offers Retry / Exit.
            console.error('[tetris-smash] kjStartV2 failed', err);
          });
      };

      try { window.parent.postMessage({ type: 'KJ_GAME_LOADED', gameId: GAME_ID }, '*'); } catch (_) {}
      window.__kjBeginSession();

      window.__kjGameStart = function (tHint, want) {
        var v = Number(want) >= 2 ? 2 : 1;
        try {
          if (typeof window.kjEmit === 'function') {
            window.kjEmit('input', { kind: 'start', v: v, tHint: typeof tHint === 'number' ? tHint : performance.now() });
          }
        } catch (_e) {}
        return v;
      };

      // One accepted action: its index, the action code and the step it was
      // applied before. The ACTION only, never its result.
      window.__kjAct = function (tHint, n, a, step) {
        try {
          if (typeof window.kjEmit === 'function') {
            window.kjEmit('input', {
              kind: 'act',
              n: typeof n === 'number' ? n : null,
              a: typeof a === 'number' ? a : null,
              step: typeof step === 'number' ? step : null,
              tHint: tHint || performance.now(),
            });
          }
        } catch (_e) {}
      };

      window.__kjSubmit = function (score) {
        if (_submitted) return;
        _submitted = true;
        if (!window.__kjEmbed) return;
        if (typeof window.kjSubmitV2 !== 'function') return;
        var clientScore = Number(score) || 0;
        var navigated = false;
        var safety = setTimeout(function () {
          if (navigated) return; navigated = true;
          try { window.parent.postMessage({ type: 'KJ_V2_RESULT', score: clientScore, pending: true, error: 'submit_timeout' }, '*'); } catch (_) {}
        }, 75000);
        window.kjSubmitV2({ clientClaimedScore: clientScore })
          .then(function (result) {
            if (navigated) return; navigated = true;
            clearTimeout(safety);
            try {
              window.parent.postMessage({
                type: 'KJ_V2_RESULT',
                score: (result && result.authoritativeScore) != null ? result.authoritativeScore : clientScore,
                authoritative: !!result && !result.alreadyFinalSession,
                flagged: !!(result && result.flaggedForReview),
                notCounted: !!(result && result.counted === false),
              }, '*');
            } catch (_) {}
          })
          .catch(function (err) {
            console.error('[tetris-smash] kjSubmitV2 failed after retries', err);
            if (navigated) return; navigated = true;
            clearTimeout(safety);
            try { window.parent.postMessage({ type: 'KJ_V2_RESULT', score: clientScore, pending: true, error: (err && err.message) || 'submit_failed' }, '*'); } catch (_) {}
          });
      };
    })();
  </script>
</body>
</html>
