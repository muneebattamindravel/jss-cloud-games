<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/games/_shared/no-touch-ui.js"></script>
  <script src="../_shared/mute.js"></script>
  <script src="../_shared/kj-tutorial-state.js"></script>
  <script src="../_shared/kj-press.js"></script>
  <script src="../_shared/kj-fit.js"></script>
  <script src="../_shared/dmath.js"></script>
  <script src="../_shared/kj-replay.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0f08" />
  <title>Chakkar Chaku</title>
  <style>
    @font-face { font-family: 'Titan One'; src: url('fonts/titan-one-400-latin.woff2') format('woff2'); font-display: swap; }
    html, body { margin: 0; height: 100%; background: #140b06; overflow: hidden; color: #fff;
      font-family: 'Titan One', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    canvas#scene { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      padding: max(22px, env(safe-area-inset-top)) 24px max(26px, env(safe-area-inset-bottom));
      box-sizing: border-box; transition: opacity .28s ease; }
    .screen.is-hidden { opacity: 0; pointer-events: none; }
    .screen.is-gone { display: none; }
    #menu { justify-content: space-between; pointer-events: none; }
    #menu button { pointer-events: auto; }
    #logo { width: min(78vw, 320px); height: auto; aspect-ratio: 640 / 300; }
    .foot { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .btn { appearance: none; border: 0; cursor: pointer; font: inherit; letter-spacing: 3px;
      color: #3b1d05; background: linear-gradient(180deg, #ffd977, #f4a62a); border-radius: 999px; padding: 17px 0;
      width: min(74vw, 290px); font-size: 20px;
      box-shadow: 0 -4px 0 rgba(0,0,0,.2) inset, 0 2px 0 rgba(255,255,255,.55) inset, 0 10px 28px rgba(255,170,40,.3);
      transition: transform .12s ease; }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .6; font-size: 13px; letter-spacing: 2px; cursor: default; }
    .btn-ghost { background: rgba(255,255,255,.08); color: #fff; box-shadow: 0 0 0 1.5px rgba(255,255,255,.35) inset; font-size: 15px; padding: 14px 0; }
    .link { appearance: none; border: 0; background: none; color: rgba(255,235,210,.8); font: inherit; font-size: 13px;
      letter-spacing: 2px; text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
    .play-pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 -4px 0 rgba(0,0,0,.2) inset, 0 2px 0 rgba(255,255,255,.55) inset, 0 10px 28px rgba(255,170,40,.28); }
      50% { box-shadow: 0 -4px 0 rgba(0,0,0,.2) inset, 0 2px 0 rgba(255,255,255,.55) inset, 0 10px 46px rgba(255,170,40,.6); } }
    #over { justify-content: center; background: rgba(20,10,4,.55); }
    .over-label { font-size: 13px; letter-spacing: 5px; color: rgba(255,235,210,.7); margin: 0; }
    .over-score { font-size: 96px; line-height: 1; margin: 10px 0 40px; color: #ffe2a8; text-shadow: 0 5px 0 rgba(0,0,0,.35); }
    #over .btn + .btn { margin-top: 12px; }
    #pready { justify-content: flex-end; }
    .ready-text { position: absolute; left: 0; right: 0; top: 24%; margin: 0; text-align: center; font-size: 42px;
      letter-spacing: 2px; color: #ffd36b; text-shadow: 0 4px 0 rgba(0,0,0,.35); animation: readyPop .45s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes readyPop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #pready .foot { margin-bottom: 9vh; }
    #pskip { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 10px; z-index: 5; }
    #pskip[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Tap anywhere to throw a knife into the spinning log. Do not hit a knife that is already stuck."></canvas>

  <section id="menu" class="screen">
    <canvas id="logo" width="640" height="300" aria-label="Chakkar Chaku"></canvas>
    <div class="foot">
      <button class="btn" id="playBtn" type="button" disabled>PREPARING YOUR GAME</button>
      <button class="link" id="howBtn" type="button">How to play</button>
    </div>
  </section>

  <section id="over" class="screen is-hidden is-gone" aria-live="polite">
    <p class="over-label">SCORE</p>
    <p class="over-score" id="overScore">0</p>
    <button class="btn" id="againBtn" type="button">PLAY AGAIN</button>
    <button class="btn btn-ghost" id="homeBtn" type="button">MENU</button>
  </section>

  <section id="pready" class="screen is-hidden is-gone" aria-live="polite">
    <p class="ready-text">YOU'RE READY!</p>
    <div class="foot"><button class="btn play-pulse" id="pplayBtn" type="button">PLAY</button></div>
  </section>
  <button class="link" id="pskip" type="button" hidden>SKIP</button>

  <!-- KJ platform bridge, the Raftaar shape:
       1. KJ_GAME_LOADED at load so the launcher knows we are here.
       2. The session is minted ON LOAD; PLAY reads PREPARING YOUR GAME until
          it exists, with no timeout. A run started without a seed can never count.
       3. __kjGameStart records the v2 marker; __kjThrow records each throw against
          the fixed step it lands before. That is all the server replays.
       4. __kjSubmit(score) once at game over, with the 75 s safety timer. -->
  <script src="/sdk/kj-sdk/kj-sdk-v2.js"></script>
  <script>
    (function () {
      var GAME_ID = 'chakkar-chaku';
      var _started = false, _submitted = false;
      window.__kjEmbed = (window.parent !== window) || /[?&]replay=1(&|$)/.test(location.search);
      if (window.__kjEmbed) document.body.classList.add('kj-embed');

      var _sessionReady = false, _readyWaiters = [];
      window.__kjOnSessionReady = function (cb) {
        if (_sessionReady) { try { cb(); } catch (_e) {} return; }
        _readyWaiters.push(cb);
      };
      function markReady() {
        if (_sessionReady) return;
        _sessionReady = true;
        var q = _readyWaiters.splice(0);
        for (var i = 0; i < q.length; i++) { try { q[i](); } catch (_e) {} }
      }

      var _platformReady = false, _wantSession = false;
      window.addEventListener('message', function (e) {
        if (!e.data) return;
        if (e.data.type === 'KJ_CONFIG' || e.data.type === 'KJ_V2_START') {
          _platformReady = true;
          if (_wantSession) { _wantSession = false; window.__kjBeginSession(); }
        }
      });

      window.__kjBeginSession = function () {
        if (_started) return;
        // Standalone: no player token and nothing can count.
        if (!window.__kjEmbed) { _started = true; markReady(); return; }
        if (!_platformReady) { _wantSession = true; return; }
        _started = true;
        if (typeof window.kjStartV2 !== 'function') return;
        window.kjStartV2({ gameId: GAME_ID })
          .then(function () { markReady(); })   // window.__kjSeed exists only now
          .catch(function (err) {
            // Deliberately NOT markReady(): the SDK has told the platform,
            // which offers Retry / Exit.
            console.error('[chakkar-chaku] kjStartV2 failed', err);
          });
      };

      try { window.parent.postMessage({ type: 'KJ_GAME_LOADED', gameId: GAME_ID }, '*'); } catch (_) {}
      window.__kjBeginSession();

      window.__kjGameStart = function (tHint, want) {
        var v = Number(want) >= 3 ? 3 : Number(want) >= 2 ? 2 : 1;
        try {
          if (typeof window.kjEmit === 'function') {
            window.kjEmit('input', { kind: 'start', v: v, tHint: typeof tHint === 'number' ? tHint : performance.now() });
          }
        } catch (_e) {}
        return v;
      };

      // One throw: its index in the run and the fixed step it lands before.
      // The ACTION only, never its result.
      window.__kjThrow = function (tHint, n, step) {
        try {
          if (typeof window.kjEmit === 'function') {
            window.kjEmit('input', {
              kind: 'throw',
              n: typeof n === 'number' ? n : null,
              step: typeof step === 'number' ? step : null,
              tHint: tHint || performance.now(),
            });
          }
        } catch (_e) {}
      };

      window.__kjSubmit = function (score) {
        if (_submitted) return;
        _submitted = true;
        if (!window.__kjEmbed) return;
        if (typeof window.kjSubmitV2 !== 'function') return;
        var clientScore = Number(score) || 0;
        var navigated = false;
        var safety = setTimeout(function () {
          if (navigated) return; navigated = true;
          try { window.parent.postMessage({ type: 'KJ_V2_RESULT', score: clientScore, pending: true, error: 'submit_timeout' }, '*'); } catch (_) {}
        }, 75000);   // above the SDK's own 3 x 20 s retry ladder
        window.kjSubmitV2({ clientClaimedScore: clientScore })
          .then(function (result) {
            if (navigated) return; navigated = true;
            clearTimeout(safety);
            try {
              window.parent.postMessage({
                type: 'KJ_V2_RESULT',
                score: (result && result.authoritativeScore) != null ? result.authoritativeScore : clientScore,
                authoritative: !!result && !result.alreadyFinalSession,
                flagged: !!(result && result.flaggedForReview),
                notCounted: !!(result && result.counted === false),
              }, '*');
            } catch (_) {}
          })
          .catch(function (err) {
            console.error('[chakkar-chaku] kjSubmitV2 failed after retries', err);
            if (navigated) return; navigated = true;
            clearTimeout(safety);
            try { window.parent.postMessage({ type: 'KJ_V2_RESULT', score: clientScore, pending: true, error: (err && err.message) || 'submit_failed' }, '*'); } catch (_) {}
          });
      };
    })();
  </script>
  <script src="js/game.js"></script>
</body>
</html>
