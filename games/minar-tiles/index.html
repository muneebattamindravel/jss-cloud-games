<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#123a6b" />
  <title>Minar Tiles</title>
  <style>
    @font-face { font-family: 'Titan One'; src: url('fonts/titan-one-400-latin.woff2') format('woff2'); font-display: block; }
    :root { --ink: #3a0f2a; --gold1: #fff1a6; --gold2: #ffc23a; --gold3: #ff8a1a; --glass: rgba(14, 30, 64, .46); --line: rgba(255,255,255,.22); }
    html, body { margin: 0; height: 100%; background: #123a6b; overflow: hidden; color: #fff;
      font-family: 'Titan One', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas#scene, canvas#fx { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
    canvas#fx { pointer-events: none; }
    #veil { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(20,30,70,.55), rgba(8,12,34,.86));
      opacity: 0; pointer-events: none; transition: opacity .35s ease; }
    #veil.on { opacity: 1; }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    #flash.go { animation: flash .45s ease-out; }
    @keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }

    /* Fixed 414 x 736 design space, contain-fitted and centred by game.js. */
    #stage { position: fixed; left: 50%; top: 50%; width: 414px; height: 736px; margin: -368px 0 0 -207px;
      transform-origin: 50% 50%; pointer-events: none; }
    #stage button { pointer-events: auto; }

    /* HUD */
    #hud { position: absolute; inset: 0; transition: opacity .3s ease; }
    #hud.is-hidden { opacity: 0; }
    .pill { background: var(--glass); box-shadow: 0 0 0 2px var(--line) inset, 0 6px 18px rgba(0,0,0,.18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .hud-score { position: absolute; left: 14px; top: 14px; padding: 8px 14px 9px; border-radius: 18px; min-width: 104px; }
    .lbl { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,.72); }
    .num { font-size: 27px; line-height: 1.05; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); font-variant-numeric: tabular-nums; }
    .pend { position: absolute; left: 14px; top: 78px; font-size: 13px; letter-spacing: 1px; padding: 5px 11px 4px; border-radius: 999px;
      color: var(--ink); background: linear-gradient(180deg, var(--gold1), var(--gold2)); box-shadow: 0 3px 0 #b8611a, 0 6px 14px rgba(0,0,0,.2);
      transition: transform .2s cubic-bezier(.2,1.8,.4,1), opacity .25s; transform-origin: 0 50%; }
    .pend.is-empty { opacity: 0; transform: scale(.6); }
    .pend.bump { transform: scale(1.22); }
    .pend.lost { background: linear-gradient(180deg, #ffb3b3, #ff5d5d); box-shadow: 0 3px 0 #a12a2a; }
    .clockwrap { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); text-align: center; }
    .clock { font-size: 30px; line-height: 1; padding: 10px 16px 8px; border-radius: 16px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .clock.hot { color: #ff5a5a; animation: tickPulse 1s steps(1) infinite; }
    @keyframes tickPulse { 0% { transform: scale(1.12); } 15% { transform: scale(1); } }
    .tbar { margin: 8px auto 0; width: 108px; height: 8px; border-radius: 99px; background: rgba(0,0,0,.28); overflow: hidden; box-shadow: 0 0 0 1.5px var(--line) inset; }
    .tbar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #6ff0c4, #ffe36b); transition: width .35s ease; }
    .tower-no { margin-top: 5px; font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,.85); text-shadow: 0 1px 0 rgba(0,0,0,.3); }
    .balls { position: absolute; left: 14px; bottom: 18px; display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border-radius: 999px; }
    .balls .ico { width: 30px; height: 30px; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff 0 8%, #9fb6ff 15%, #3049a8 50%, #121a44 100%); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
    .balls .cnt { font-size: 25px; line-height: 1; min-width: 30px; transition: transform .15s cubic-bezier(.2,1.8,.4,1); font-variant-numeric: tabular-nums; }
    .balls .cnt.low { color: #ff7070; }
    .balls .cnt.bump { transform: scale(1.3); }
    .combo { position: absolute; right: 14px; bottom: 16px; padding: 6px 16px 5px; border-radius: 16px; text-align: center;
      color: var(--ink); background: linear-gradient(180deg, var(--gold1), var(--gold2) 60%, var(--gold3)); box-shadow: 0 4px 0 #a5481a, 0 0 26px rgba(255,180,60,.55);
      transform: scale(0); transition: transform .28s cubic-bezier(.2,1.8,.4,1); }
    .combo.on { transform: scale(1); }
    .combo.pop { animation: comboPop .35s cubic-bezier(.2,1.8,.4,1); }
    .combo b { display: block; font-weight: 400; font-size: 30px; line-height: 1; }
    .combo span { font-size: 10px; letter-spacing: 2px; }
    .combo.x3 { background: linear-gradient(180deg, #ffe1a8, #ff9a3a 60%, #ff5a2a); box-shadow: 0 4px 0 #9a2a10, 0 0 30px rgba(255,120,40,.7); }
    .combo.x4 { background: linear-gradient(180deg, #ffd0f0, #ff5ab8 55%, #c23aff); box-shadow: 0 4px 0 #6a1a8a, 0 0 34px rgba(255,80,200,.75); color: #fff; }
    @keyframes comboPop { 0% { transform: scale(1.6) rotate(-6deg); } 100% { transform: scale(1); } }
    .mute { position: absolute; right: 14px; top: 14px; width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; }
    .mute svg { width: 24px; height: 24px; }
    .mute .x { display: none; } .mute.off .x { display: inline; } .mute.off .w { display: none; }

    /* Banners */
    #banner { position: absolute; left: 0; right: 0; top: 16%; text-align: center; pointer-events: none; }
    .ban { display: inline-block; font-size: 46px; line-height: 1; letter-spacing: 1px; color: #fff6cf;
      -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink), 0 12px 26px rgba(0,0,0,.35);
      animation: banPop .55s cubic-bezier(.2,1.7,.4,1) both; }
    .ban.big { font-size: 58px; background: linear-gradient(180deg, var(--gold1), var(--gold2) 55%, var(--gold3)); -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-stroke: 0; text-shadow: none; filter: drop-shadow(0 5px 0 var(--ink)) drop-shadow(0 0 3px var(--ink)) drop-shadow(0 12px 20px rgba(0,0,0,.35)); }
    .ban.grey { color: #eef3f7; -webkit-text-stroke-color: #2a3442; text-shadow: 0 5px 0 #2a3442, 0 12px 26px rgba(0,0,0,.35); font-size: 40px; }
    .ban.out { animation: banOut .3s ease-in both; }
    .sub { display: block; margin-top: 10px; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 12px rgba(0,0,0,.3);
      animation: banPop .5s .15s cubic-bezier(.2,1.7,.4,1) both; transition: opacity .2s; }
    .sub.red { color: #ffa0a0; }
    @keyframes banPop { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes banOut { to { transform: scale(1.3); opacity: 0; } }

    /* Screens */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; transition: opacity .3s ease; }
    .screen.is-hidden { opacity: 0; pointer-events: none; }
    .screen.is-hidden button { pointer-events: none; }
    .screen.is-gone { display: none; }
    #menu { justify-content: space-between; padding: 40px 0 44px; box-sizing: border-box; }
    #logo { width: 380px; height: 222px; animation: logoIn .9s cubic-bezier(.2,1.5,.4,1) both; }
    @keyframes logoIn { from { transform: translateY(-40px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
    .foot { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .best { font-size: 14px; letter-spacing: 3px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); margin-bottom: 4px; min-height: 18px; }
    .btn { appearance: none; border: 0; cursor: pointer; font: inherit; letter-spacing: 3px; color: var(--ink);
      background: linear-gradient(180deg, var(--gold1), var(--gold2) 55%, var(--gold3)); border-radius: 999px; padding: 18px 0; width: 280px; font-size: 23px;
      box-shadow: 0 -5px 0 rgba(0,0,0,.14) inset, 0 3px 0 rgba(255,255,255,.65) inset, 0 7px 0 #a5481a, 0 16px 28px rgba(0,0,0,.3);
      transition: transform .12s ease; }
    .btn:active { transform: translateY(5px); box-shadow: 0 -5px 0 rgba(0,0,0,.14) inset, 0 3px 0 rgba(255,255,255,.65) inset, 0 2px 0 #a5481a, 0 8px 18px rgba(0,0,0,.3); }
    .btn-ghost { background: rgba(20,32,74,.55); color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.6) inset; font-size: 15px; padding: 14px 0; width: 240px; }
    .btn-ghost:active { transform: scale(.97); box-shadow: 0 0 0 2px rgba(255,255,255,.6) inset; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.05); } }

    #pready { justify-content: center; gap: 34px; }
    .ready-text { margin: 0; font-size: 46px; color: var(--gold1); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
      text-shadow: 0 5px 0 var(--ink); animation: banPop .5s cubic-bezier(.2,1.7,.4,1) both; }
    .pcap { position: absolute; left: 22px; right: 22px; top: 96px; margin: 0; text-align: center; font-size: 25px; line-height: 1.2;
      color: #fff; -webkit-text-stroke: 2px rgba(30,10,40,.6); paint-order: stroke fill; text-shadow: 0 3px 0 rgba(30,10,40,.45);
      opacity: 0; transform: translateY(-8px); transition: opacity .25s ease, transform .3s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
    .pcap.on { opacity: 1; transform: none; }
    .btn-skip { position: absolute; left: 14px; top: 16px; appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 14px;
      letter-spacing: 2px; color: #fff; padding: 12px 18px 10px; border-radius: 999px; }
    .btn-skip[hidden] { display: none; }

    /* The practice's pointers: a tapping ring over a block, and a swipe hint. */
    #phand { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 2; }
    #phand.on { opacity: 1; }
    #phand i { position: absolute; left: -28px; top: -28px; width: 56px; height: 56px; border-radius: 50%; border: 4px solid #fff;
      box-sizing: border-box; box-shadow: 0 0 14px rgba(255,240,160,.95); animation: ring 1.1s ease-out infinite; }
    #phand i + i { animation-delay: .55s; }
    #phand b { position: absolute; left: -10px; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 4px rgba(58,15,42,.5); animation: tapDot 1.1s ease-in-out infinite; }
    @keyframes ring { from { transform: scale(.45); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
    @keyframes tapDot { 0%, 100% { transform: scale(1); } 15% { transform: scale(.7); } }
    #pswipe { position: absolute; left: 50%; top: 60%; width: 0; height: 0; opacity: 0; transition: opacity .25s; pointer-events: none; }
    #pswipe.on { opacity: 1; }
    #pswipe b { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 5px rgba(58,15,42,.45), 0 0 18px rgba(255,255,255,.9); animation: swipe 1.5s cubic-bezier(.5,0,.3,1) infinite; }
    #pswipe i { position: absolute; left: -110px; top: -3px; width: 220px; height: 6px; border-radius: 9px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); }
    @keyframes swipe { 0% { transform: translateX(95px); opacity: 0; } 15% { opacity: 1; } 75% { transform: translateX(-95px); opacity: 1; } 100% { transform: translateX(-95px); opacity: 0; } }

    #over { justify-content: center; }
    .ov-title { font-size: 18px; letter-spacing: 6px; color: rgba(255,255,255,.75); margin: 0; }
    .ov-score { font-size: 88px; line-height: 1; margin: 8px 0 4px; font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, var(--gold1), var(--gold2) 55%, var(--gold3)); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 6px 0 var(--ink)) drop-shadow(0 0 3px var(--ink)); }
    .ov-best { font-size: 15px; letter-spacing: 3px; margin: 6px 0 18px; color: #fff; min-height: 20px; }
    .ov-best.new { color: var(--ink); background: linear-gradient(180deg, var(--gold1), var(--gold2)); padding: 6px 14px 4px; border-radius: 999px;
      animation: banPop .5s cubic-bezier(.2,1.7,.4,1) both; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 330px; margin-bottom: 24px; }
    .stat { border-radius: 16px; padding: 10px 12px 9px; text-align: center;
      opacity: 0; transform: translateY(12px) scale(.9); transition: opacity .3s, transform .4s cubic-bezier(.2,1.6,.4,1); }
    .stat.in { opacity: 1; transform: none; }
    .stat .v { font-size: 28px; line-height: 1.1; }
    .stat .k { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,.72); }
    #over .btn-ghost { margin-top: 14px; }
    @media (prefers-reduced-motion: reduce) { .pulse, .clock.hot { animation: none; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Swipe to turn the tower. Tap a block to fire a ball at it. Same colour blocks touching it break too."></canvas>
  <canvas id="fx"></canvas>
  <div id="veil"></div>
  <div id="flash"></div>
  <div id="phand" aria-hidden="true"><i></i><i></i><b></b></div>

  <div id="stage">
    <div id="hud" class="is-hidden">
      <div class="hud-score pill"><div class="lbl">SCORE</div><div class="num" id="hScore">0</div></div>
      <div class="pend is-empty" id="hPend">+0</div>
      <div class="clockwrap">
        <div class="clock pill" id="hClock">03:00</div>
        <div class="tbar"><i id="hBar"></i></div>
        <div class="tower-no" id="hTower">TOWER 1</div>
      </div>
      <div class="balls pill"><div class="ico"></div><div class="cnt" id="hBalls">0</div></div>
      <div class="combo" id="hCombo"><b id="hComboX">x2</b><span>COMBO</span></div>
    </div>
    <button class="mute pill" id="muteBtn" type="button" aria-label="Sound on or off">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/>
        <path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
        <path class="x" d="M17 9l5 6M22 9l-5 6"/>
      </svg>
    </button>
    <div id="banner"></div>

    <section id="menu" class="screen">
      <canvas id="logo" width="760" height="444" aria-label="Minar Tiles"></canvas>
      <div class="foot">
        <div class="best" id="menuBest"></div>
        <button class="btn pulse" id="playBtn" type="button">PLAY</button>
        <button class="btn btn-ghost" id="howBtn" type="button">HOW TO PLAY</button>
      </div>
    </section>

    <section id="pready" class="screen is-hidden is-gone">
      <p class="ready-text">YOU'RE READY!</p>
      <button class="btn pulse" id="pplayBtn" type="button">PLAY</button>
    </section>
    <p id="pcap" class="pcap"></p>
    <div id="pswipe" aria-hidden="true"><i></i><b></b></div>
    <button class="btn-skip pill" id="pskip" type="button" hidden>SKIP</button>

    <section id="over" class="screen is-hidden is-gone" aria-live="polite">
      <p class="ov-title">FINAL SCORE</p>
      <p class="ov-score" id="ovScore">0</p>
      <p class="ov-best" id="ovBest">BEST 0</p>
      <div class="stats">
        <div class="stat pill"><div class="v" id="stTowers">0</div><div class="k">TOWERS SMASHED</div></div>
        <div class="stat pill"><div class="v" id="stChunk">0</div><div class="k">BIGGEST CHUNK</div></div>
        <div class="stat pill"><div class="v" id="stCombo">x1</div><div class="k">BEST COMBO</div></div>
        <div class="stat pill"><div class="v" id="stBlocks">0</div><div class="k">BLOCKS BROKEN</div></div>
      </div>
      <button class="btn" id="againBtn" type="button">PLAY AGAIN</button>
      <button class="btn btn-ghost" id="homeBtn" type="button">MENU</button>
    </section>
  </div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
